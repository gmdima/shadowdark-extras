name: Create Module Files For GitHub Release

env:
  project_url: 'https://github.com/${{ github.repository }}'
  latest_manifest_url: 'https://github.com/${{ github.repository }}/releases/latest/download/module.json'
  release_system_url: 'https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip'

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Modify Module Manifest With Release-Specific Values
        uses: cschleiden/replace-tokens@v1
        with:
          files: 'module.json'
        env:
          VERSION: ${{ github.event.release.tag_name }}
          URL: ${{ env.project_url }}
          MANIFEST: ${{ env.latest_manifest_url }}
          DOWNLOAD: ${{ env.release_system_url }}

      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dev Dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Build Compendium Packs From YAML Source
        if: hashFiles('package.json') != ''
        run: |
          if npm run | grep -q " pack"; then
            npm run pack
          else
            echo "No npm pack script found, skipping."
          fi

      - name: Create Module Archive
        run: |
          zip_items=""

          for item in \
            module.json \
            README.md \
            LICENSE \
            LICENSE.txt \
            assets \
            data \
            greensock \
            i18n \
            libs \
            maps \
            packs \
            scripts \
            styles \
            templates \
            art
          do
            if [ -e "$item" ]; then
              zip_items="$zip_items $item"
            else
              echo "Skipping missing item: $item"
            fi
          done

          zip -r module.zip $zip_items

      - name: Update Release With Files
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          draft: false
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json,./module.zip'
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
